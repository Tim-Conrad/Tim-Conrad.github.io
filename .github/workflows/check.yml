name: Check the pages

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: CSP rules and sitemap
        run: python3 scripts/check.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tests of the tool page generator
        run: |
          pip install markdown==3.11.3
          python3 -m unittest scripts/test_gen_tools.py
